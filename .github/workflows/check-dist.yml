name: Check dist

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: npm install

      - name: Build dist
        run: npm run build

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git diff --ignore-space-at-eol dist/)" ]; then
            echo "::error::dist/ is out of sync with source. Run 'npm run build' and commit the result."
            git diff dist/
            exit 1
          fi
